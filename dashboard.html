<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReconMaster v3 — Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #0d0d0f; color: #ccc; margin: 0; padding: 1.5rem;
    max-width: 1200px; margin-inline: auto;
  }
  h1 { font-size: 1.3rem; letter-spacing: .04em; margin: 0 0 1rem; }
  h1 span { color: #5cf; }
  .bar {
    display: flex; gap: .5rem; flex-wrap: wrap; align-items: center;
    background: #16161a; border: 1px solid #2a2a30; border-radius: 8px;
    padding: .75rem; margin-bottom: 1rem;
  }
  input[type=text] {
    flex: 1 1 260px; min-width: 0; background: #0d0d0f; color: #eee;
    border: 1px solid #333; border-radius: 6px; padding: .55rem .7rem;
    font: inherit;
  }
  button {
    background: #1f6feb; color: #fff; border: 0; border-radius: 6px;
    padding: .55rem 1.1rem; font: inherit; cursor: pointer;
  }
  button:disabled { background: #444; cursor: not-allowed; }
  button.stop { background: #b62324; }
  .status { font-size: .8rem; color: #888; margin-left: auto; }
  .status.live { color: #5f5; }
  .counts { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .chip {
    border: 1px solid #333; border-radius: 999px; padding: .2rem .7rem;
    font-size: .78rem;
  }
  .chip b { font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { border: 1px solid #26262c; padding: .55rem .6rem; vertical-align: top; text-align: left; }
  th { background: #16161a; position: sticky; top: 0; }
  tr:hover td { background: #131316; }
  .sev { font-weight: 700; text-transform: uppercase; font-size: .72rem;
         padding: .1rem .45rem; border-radius: 4px; white-space: nowrap; }
  .sev.critical { background: #5b1e5b; color: #ff8bff; }
  .sev.high     { background: #4a1414; color: #ff6b6b; }
  .sev.medium   { background: #4a3410; color: #ffbf5c; }
  .sev.low      { background: #10314a; color: #5cc0ff; }
  .sev.info     { background: #123512; color: #6bd66b; }
  .title { font-weight: 600; color: #eee; }
  .detail { color: #999; font-size: .78rem; }
  .asset { color: #7aa2ff; word-break: break-all; }
  pre { background: #000; color: #7f7; padding: .4rem .5rem; margin: .35rem 0 0;
        white-space: pre-wrap; word-break: break-all; max-height: 8rem; overflow: auto;
        border-radius: 4px; font-size: .74rem; }
  .badge-new { background: #0d3b52; color: #5cf; font-size: .62rem;
               padding: .05rem .35rem; border-radius: 3px; margin-left: .4rem; }
  .empty { color: #666; text-align: center; padding: 2rem; }
</style>
</head>
<body>
  <h1>RECONMASTER <span>v3</span> — live dashboard</h1>

  <div class="bar">
    <input id="target" type="text" placeholder="target domain (e.g. example.com you are authorised to test)" autocomplete="off">
    <button id="start">Start scan</button>
    <button id="stop" class="stop" disabled>Stop</button>
    <span id="status" class="status">idle</span>
  </div>

  <div class="counts">
    <span class="chip">total <b id="c-total">0</b></span>
    <span class="chip" style="color:#ff8bff">critical <b id="c-critical">0</b></span>
    <span class="chip" style="color:#ff6b6b">high <b id="c-high">0</b></span>
    <span class="chip" style="color:#ffbf5c">medium <b id="c-medium">0</b></span>
    <span class="chip" style="color:#5cc0ff">low <b id="c-low">0</b></span>
    <span class="chip" style="color:#6bd66b">info <b id="c-info">0</b></span>
  </div>

  <table>
    <thead>
      <tr><th style="width:90px">Severity</th><th>Finding</th></tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="2" class="empty" id="empty">No findings yet — start a scan.</td></tr>
    </tbody>
  </table>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const counts = { total: 0, critical: 0, high: 0, medium: 0, low: 0, info: 0 };
  let es = null;

  function setStatus(text, live) {
    const s = $("status");
    s.textContent = text;
    s.classList.toggle("live", !!live);
  }

  function bumpCounts(sev) {
    counts.total++;
    if (counts[sev] !== undefined) counts[sev]++;
    for (const k in counts) $("c-" + k).textContent = counts[k];
  }

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function addRow(f) {
    const empty = $("empty");
    if (empty) empty.parentElement.remove();
    const sev = (f.severity || "info").toLowerCase();
    bumpCounts(sev);
    const isNew = f.new ? '<span class="badge-new">NEW</span>' : "";
    const conf = f.confidence ? ` · ${esc(f.confidence)}` : "";
    const rem = f.remediation ? `<div class="detail">→ ${esc(f.remediation)}</div>` : "";
    const ev = f.evidence ? `<pre>${esc(f.evidence)}</pre>` : "";
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td><span class="sev ${sev}">${esc(sev)}</span></td>` +
      `<td><span class="title">${esc(f.title || "(untitled)")}</span>${isNew}` +
      `<div class="asset">${esc(f.asset || "")}</div>` +
      `<div class="detail">${esc(f.detail || "")}${conf}</div>${rem}${ev}</td>`;
    $("rows").prepend(tr);
  }

  function stop() {
    if (es) { es.close(); es = null; }
    $("start").disabled = false;
    $("stop").disabled = true;
    setStatus("stopped", false);
  }

  $("start").addEventListener("click", () => {
    const t = $("target").value.trim().replace(/^https?:\/\//, "").replace(/\/$/, "");
    if (!t) { setStatus("enter a target", false); return; }
    $("start").disabled = true;
    $("stop").disabled = false;
    setStatus("scanning " + t + " …", true);

    es = new EventSource("/stream?t=" + encodeURIComponent(t));
    es.onmessage = e => {
      if (!e.data) return;
      let f;
      try { f = JSON.parse(e.data); } catch (_) { return; }
      addRow(f);
    };
    es.onerror = () => {
      // server closed the stream or auth expired
      setStatus("stream closed", false);
      stop();
    };
  });

  $("stop").addEventListener("click", stop);
  $("target").addEventListener("keydown", e => { if (e.key === "Enter") $("start").click(); });
})();
</script>
</body>
</html>
