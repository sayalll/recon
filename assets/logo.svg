<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff9d"/>
      <stop offset="1" stop-color="#00b4ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- crosshair / target = recon -->
  <g stroke="url(#acc)" stroke-width="10" fill="none" filter="url(#glow)">
    <circle cx="256" cy="236" r="130"/>
    <circle cx="256" cy="236" r="80" opacity="0.7"/>
    <line x1="256" y1="66"  x2="256" y2="126"/>
    <line x1="256" y1="346" x2="256" y2="406"/>
    <line x1="86"  y1="236" x2="146" y2="236"/>
    <line x1="366" y1="236" x2="426" y2="236"/>
  </g>
  <circle cx="256" cy="236" r="18" fill="#ff3b5c" filter="url(#glow)"/>
  <!-- terminal underscore = findings output -->
  <rect x="146" y="420" width="220" height="18" rx="9" fill="url(#acc)" opacity="0.9"/>
</svg>
