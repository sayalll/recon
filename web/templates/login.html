<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReconMaster — Login</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, Menlo, Consolas, monospace;
         background: #0d0d0f; color: #ccc; display: grid; place-items: center;
         height: 100vh; margin: 0; }
  .box { background: #16161a; border: 1px solid #2a2a30; border-radius: 10px;
         padding: 2rem; width: min(360px, 90vw); }
  h1 { font-size: 1.1rem; margin: 0 0 1rem; letter-spacing: .04em; }
  h1 span { color: #5cf; }
  input { width: 100%; box-sizing: border-box; background: #0d0d0f; color: #eee;
          border: 1px solid #333; border-radius: 6px; padding: .6rem .7rem;
          font: inherit; margin-bottom: .8rem; }
  button { width: 100%; background: #1f6feb; color: #fff; border: 0;
           border-radius: 6px; padding: .6rem; font: inherit; cursor: pointer; }
  .err { color: #ff6b6b; font-size: .8rem; margin-bottom: .6rem; min-height: 1em; }
  .hint { color: #666; font-size: .72rem; margin-top: .9rem; }
</style>
</head>
<body>
  <div class="box">
    <h1>RECONMASTER <span>v3</span> — sign in</h1>
    <form method="post" action="/login">
      <div class="err">{{ error }}</div>
      <input type="password" name="password" placeholder="dashboard password" autofocus>
      <button type="submit">Enter</button>
    </form>
    <div class="hint">Set the password with <code>RM_DASHBOARD_PASS</code>;
      otherwise a random one is printed to the console at startup.</div>
  </div>
</body>
</html>
